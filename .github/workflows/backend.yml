name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "database/**"
      - "docker/.env.test"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "database/**"
      - "docker/.env.test"
      - ".github/workflows/backend.yml"

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Security audit
        run: npm run security:scan

  test:
    needs: quality
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskmanager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create test environment
        run: |
          cat <<EOF > ../docker/.env.test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5434/taskmanager_test?schema=public
          JWT_SECRET=ci-only-test-secret-not-for-production
          EOF
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Initialize test database
        run: PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d taskmanager_test -f ../database/init.sql
      - name: Test with coverage
        run: npm run test:coverage
      - name: E2E tests
        timeout-minutes: 2
        run: npm run test:e2e

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push API image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
