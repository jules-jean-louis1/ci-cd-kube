name: build, test and deploy

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  deps_leak:
    defaults:
      run:
        shell: bash
        working-directory: api

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies
        run: npm audit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format_lint:
    defaults:
      run:
        working-directory: api

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

  pr_checks:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run extra security scan
        run: npm run security:scan

  test_api:
    needs: [deps_leak, format_lint]
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskmanager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test env file
        run: |
          cat <<EOF > ../docker/.env.test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5434/taskmanager_test?schema=public
          JWT_SECRET=ci-only-test-secret-not-for-production
          EOF

      - name: Init Prisma Client
        run: |
          npm run prisma:generate

      - name: Run SQL init script
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d taskmanager_test -f ../database/init.sql

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run e2e tests (Cucumber)
        timeout-minutes: 2
        run: npm run test:e2e

  publish_api_image:
    needs: [test_api]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    environment: Production

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,prefix=prod-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build Docker image for security scan
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          target: production
          load: true
          tags: taskmanager-api:local
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskmanager-api:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  notify_google_chat:
    needs: [deps_leak, format_lint, pr_checks, test_api, publish_api_image]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets['GOOGLE_CHAT_WEBHOOK'] }}

    steps:
      - name: Send pipeline notification
        if: env.GOOGLE_CHAT_WEBHOOK != ''
        continue-on-error: true
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            status="FAILURE"
          else
            status="SUCCESS"
          fi

          payload=$(jq -n \
            --arg status "$status" \
            --arg commit "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg run "$RUN_URL" \
            '{text: ("Pipeline CI/CD: " + $status + "\nCommit: " + $commit + "\nMessage: " + $message + "\nLogs: " + $run)}')

          curl --fail-with-body -X POST \
            -H 'Content-Type: application/json; charset=UTF-8' \
            --data "$payload" \
            "$GOOGLE_CHAT_WEBHOOK"

      - name: Report missing Google Chat webhook
        if: env.GOOGLE_CHAT_WEBHOOK == ''
        run: echo "GOOGLE_CHAT_WEBHOOK is not configured; notification skipped."
